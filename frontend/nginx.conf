# Content Creator Engine - Nginx reverse proxy + static frontend server.

# ---- Compression ----
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    text/xml
    image/svg+xml
    application/wasm
    font/woff
    font/woff2;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Reverse proxy: /api/* -> FastAPI (strips the /api prefix) ----
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout  60s;
    }

    # ---- Media endpoints: never cache (watermarked media is private/volatile) ----
    # Proxied variant: /api/media/... -> backend /media/... (strip only the /api prefix)
    location /api/media/ {
        # Hide any upstream Cache-Control so nginx is authoritative for media.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout  60s;
    }

    # Direct variant (media is also exposed at /media/...)
    location /media/ {
        # Hide any upstream Cache-Control so nginx is authoritative for media.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout  60s;
    }

    # ---- Hashed build assets (Vite emits content-hashed filenames): immutable ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- index.html: always revalidate so new deploys propagate ----
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ---- Everything else: SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
