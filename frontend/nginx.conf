# Content Creator Engine - Nginx reverse proxy + static frontend server.

# ---- Compression ----
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    text/xml
    image/svg+xml
    application/wasm
    font/woff
    font/woff2;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow photo-post uploads. The app caps each file at 10 MB; this is the
    # total request body, so leave headroom for multi-photo posts.
    client_max_body_size 50m;

    # ---- Reverse proxy: /api/* -> FastAPI (strips the /api prefix) ----
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        # WebSocket upgrade (DM realtime: ws://host/api/ws/dms) — nginx must
        # forward the Upgrade handshake to the backend.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout  60s;
    }

    # ---- Content-media endpoints: never cache (watermarked media is private/volatile) ----
    # Proxied variant: /api/content/... -> backend /content/... (strip only the /api prefix)
    location /api/content/ {
        # Hide any upstream Cache-Control so nginx is authoritative for media.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout  60s;
    }

    # Direct variant (content media is also exposed at /content/...)
    location /content/ {
        # Hide any upstream Cache-Control so nginx is authoritative for media.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout  60s;
    }

    # ---- Hashed build assets (Vite emits content-hashed filenames): immutable ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- Public creator landing page (/creator/{id}) ----
    location /creator/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /landing.html;
    }

    # ---- Subscribe / checkout page (/checkout?creator_id={id}) ----
    location /checkout/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /checkout.html;
    }

    location = /checkout {
        add_header Cache-Control "no-cache" always;
        try_files $uri /checkout.html;
    }

    # ---- DM chat (/chat or /chat?conversation={id}) ----
    location /chat/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /chat.html;
    }

    location = /chat {
        add_header Cache-Control "no-cache" always;
        try_files $uri /chat.html;
    }

    # ---- Subscriber feed view (/feed?creator_id={id} or /feed/{id}) ----
    location /feed/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /feed.html;
    }

    location = /feed {
        add_header Cache-Control "no-cache" always;
        try_files $uri /feed.html;
    }

    # ---- landing.html: always revalidate so new deploys propagate ----
    location = /landing.html {
        add_header Cache-Control "no-cache" always;
    }

    # ---- index.html: always revalidate so new deploys propagate ----
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ---- Everything else: SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
