<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin — Content Creator Engine</title>
        <!--
            Creator (admin) dashboard. Reaching it from a clean URL: /admin
            (also available as the /settings.html alias). Non-creators are
            redirected away by the app shell. Sign in with the seeded creator
            account (python -m app.seed_creator).
        -->
        <script
            type="module"
            src="/src/pages/creator-settings-app.ts"
        ></script>
        <style>
            body {
                margin: 0;
                background-color: #d1e4ef; /* fallback until /theme.css applies */
                background-color: var(--cc-page-bg);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
        </style>
        <link rel="stylesheet" href="/theme.css" />
    <script>
        /* FOUC guard: apply the persisted theme before first paint. */
        (function () {
            try {
                var t = localStorage.getItem('cc_theme');
                if (t === 'aero' || t === 'olive' || t === 'silver') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) {}
        })();
    </script>
    </head>
    <body>
        <roque-settings-app></roque-settings-app>
    </body>
</html>
