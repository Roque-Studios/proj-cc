<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Content Creator Engine</title>
        <script
            type="module"
            src="/src/pages/creator-landing.ts"
        ></script>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #d1e4ef; /* fallback until /theme.css applies */
                
                background: linear-gradient(
                        180deg,
                        rgba(var(--cc-tint), 0.45) 0%,
                        rgba(255, 255, 255, 0.9) 40%
                    ),
                    var(--cc-page-bg);
                min-height: 100vh;
            }
        </style>
        <link rel="stylesheet" href="/theme.css" />
    <script>
        /* FOUC guard: apply the persisted theme before first paint. */
        (function () {
            try {
                var t = localStorage.getItem('cc_theme');
                if (t === 'aero' || t === 'olive' || t === 'silver') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) {}
        })();
    </script>
    </head>
    <body>
        <roque-creator-landing></roque-creator-landing>
    </body>
</html>
