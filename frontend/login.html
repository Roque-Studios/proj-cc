<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign in</title>
        <!--
            Shared sign-in page for every role (followers and creators).
            After sign-in the user is redirected by role: creators to the
            /admin dashboard, members back to the page they came from (the
            optional ?next= parameter).
        -->
        <script
            type="module"
            src="/src/pages/login-page.ts"
        ></script>
        <style>
            body {
                margin: 0;
                background-color: #d1e4ef; /* fallback until /theme.css applies */
                background-color: var(--cc-page-bg);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
        </style>
        <link rel="stylesheet" href="/theme.css" />
    <script>
        /* FOUC guard: apply the persisted theme before first paint. */
        (function () {
            try {
                var t = localStorage.getItem('cc_theme');
                if (t === 'aero' || t === 'olive' || t === 'silver') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) {}
        })();
    </script>
    </head>
    <body>
        <roque-login-page></roque-login-page>
    </body>
</html>
