services:
  db:
    image: postgres:15
    container_name: cc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cc_net

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cc_net

  api:
    build: ./backend
    container_name: cc-api
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      WATERMARK_CACHE_REDIS_URL: ${WATERMARK_CACHE_REDIS_URL:-redis://redis:6379/2}
      WATERMARK_CACHE_TTL_SECONDS: ${WATERMARK_CACHE_TTL_SECONDS:-3600}
      TOKEN_REVOCATION_REDIS_URL: ${TOKEN_REVOCATION_REDIS_URL:-redis://redis:6379/3}
      SECRET_KEY: ${SECRET_KEY}
    command: bash ./entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cc_net

  # Celery worker: consumes tasks from the Redis broker and writes results back.
  worker:
    build: ./backend
    container_name: cc-worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      WATERMARK_CACHE_REDIS_URL: ${WATERMARK_CACHE_REDIS_URL:-redis://redis:6379/2}
      WATERMARK_CACHE_TTL_SECONDS: ${WATERMARK_CACHE_TTL_SECONDS:-3600}
      SECRET_KEY: ${SECRET_KEY}
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cc_net

  # Celery beat: schedules periodic tasks (e.g. expiring non-renewing
  # subscriptions) onto the worker.
  beat:
    build: ./backend
    container_name: cc-beat
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      WATERMARK_CACHE_REDIS_URL: ${WATERMARK_CACHE_REDIS_URL:-redis://redis:6379/2}
      WATERMARK_CACHE_TTL_SECONDS: ${WATERMARK_CACHE_TTL_SECONDS:-3600}
      SECRET_KEY: ${SECRET_KEY}
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cc_net

  ui:
    build: ./frontend
    container_name: cc-ui
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - api
    networks:
      - cc_net

volumes:
  postgres_data:
  redis_data:

networks:
  cc_net:
    driver: bridge
